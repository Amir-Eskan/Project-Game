.start {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    padding: 50px 64px;
    text-align: center;
    border-radius: 28px;
    overflow: hidden;
margin: 100px auto;
  
    background:
        radial-gradient(rgba(148, 163, 184, .07) 1px, transparent 1px),
        linear-gradient(145deg, rgba(15, 23, 42, .9), rgba(30, 27, 75, .8));
    background-size: 22px 22px, cover;

    border: 1px solid rgba(148, 163, 184, .15);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 60px rgba(2, 6, 23, .65),
        0 0 80px rgba(99, 102, 241, .18),
        inset 0 1px 0 rgba(255, 255, 255, .08);

    animation:
        cardIn   .9s cubic-bezier(.22, 1, .36, 1) both,
        cardFloat 6s ease-in-out 1.2s infinite;
}


.start::before {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #60a5fa, #a855f7, transparent);
    box-shadow: 0 0 12px rgba(96, 165, 250, .9);
    animation: lineGlow 3s ease-in-out infinite;
}


.start::after {
    content: '';
    position: absolute;
    inset: -40%;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(circle at 30% 20%, rgba(96, 165, 250, .16), transparent 45%),
        radial-gradient(circle at 75% 85%, rgba(168, 85, 247, .18), transparent 45%);
    animation: blobMove 8s ease-in-out infinite alternate;
}


.start img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;

  
    border: 4px solid transparent;
    background:
        linear-gradient(#0b1026, #0b1026) padding-box,
        conic-gradient(from var(--angle), #38bdf8, #a855f7, #60a5fa, #38bdf8) border-box;

    box-shadow:
        0 0 30px rgba(96, 165, 250, .35),
        0 0 70px rgba(168, 85, 247, .25);

        imgIn      .9s cubic-bezier(.22, 1, .36, 1) .15s backwards,
        spinAngle  6s linear infinite,
        imgGlow    3.5s ease-in-out 1s infinite;
}

.start img:hover {
    transform: scale(1.07) rotate(3deg);
}

#start {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 14px;

    font-family: 'Orbitron', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff;

    padding: 18px 48px;
    border: none;
    border-radius: 60px;
    cursor: pointer;

    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #a855f7 100%);
    background-size: 180% 180%;

    box-shadow:
        0 10px 30px rgba(37, 99, 235, .35),
        inset 0 1px 0 rgba(255, 255, 255, .25);

    transition:
        transform .35s cubic-bezier(.34, 1.56, .64, 1),
        box-shadow .35s ease,
        background-position .6s ease;

    animation:
        btnIn   .9s cubic-bezier(.22, 1, .36, 1) .3s backwards,
        btnGlow 3s ease-in-out 1.4s infinite;
}


#start::before {
    content: '';
    position: absolute;
    top: 0;
    left: -80%;
    width: 50%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .4), transparent);
    transform: skewX(-20deg);
    animation: shine 3.5s ease-in-out 1.6s infinite;
}

#start i {
    display: inline-block;
    font-size: 1.35rem;
    animation: gamepad 2.2s ease-in-out infinite;
}

#start:hover {
    transform: translateY(-4px) scale(1.05);
    background-position: 100% 50%;
    box-shadow:
        0 16px 45px rgba(37, 99, 235, .5),
        0 0 55px rgba(168, 85, 247, .55),
        inset 0 1px 0 rgba(255, 255, 255, .3);
}

#start:active {
    transform: translateY(0) scale(.95);
    transition-duration: .1s;
}

#start:focus-visible {
    outline: 2px solid #a855f7;
    outline-offset: 4px;
}


@keyframes cardIn {
    from { opacity: 0; transform: translateY(45px) scale(.94); }
    to   { opacity: 1; transform: none; }
}

@keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
}

@keyframes imgIn {
    from { opacity: 0; transform: scale(.6) rotate(-15deg); }
    to   { opacity: 1; transform: none; }
}

@keyframes spinAngle {
    to { --angle: 360deg; }
}

@keyframes imgGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(96, 165, 250, .35), 0 0 70px rgba(168, 85, 247, .25); }
    50%      { box-shadow: 0 0 45px rgba(96, 165, 250, .65), 0 0 100px rgba(168, 85, 247, .45); }
}

@keyframes btnIn {
    from { opacity: 0; transform: translateY(30px) scale(.9); }
    to   { opacity: 1; transform: none; }
}

@keyframes btnGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(124, 58, 237, .4)); }
    50%      { filter: drop-shadow(0 0 28px rgba(168, 85, 247, .8)); }
}

@keyframes shine {
    0%        { left: -80%; }
    60%, 100% { left: 130%; }
}

@keyframes gamepad {
    0%, 100% { transform: rotate(0) scale(1); }
    25%      { transform: rotate(-14deg) scale(1.15); }
    50%      { transform: rotate(0) scale(1.05); }
    75%      { transform: rotate(14deg) scale(1.15); }
}

@keyframes lineGlow {
    0%, 100% { opacity: .6; }
    50%      { opacity: 1; }
}

@keyframes blobMove {
    from { transform: translate(-15px, -10px) scale(1); }
    to   { transform: translate(15px, 10px) scale(1.08); }
}

 p2.innerText++

    icon1.className=('fa-solid fa-hand-back-fist')
p2.innerText++
